# Ścieżka przykładowa (fikcyjna) — pokazuje strukturę danych.
name:
  pl: Ustrzyki test
  en: Ustrzyki test
subtitle:
  pl: test
  en: test
summary:
  pl: Krótka pętla przez buczynę do źródlisk i punktu widokowego, z trzech wejść. (Opis przykładowy.)
  en: A short walk through beech forest to the springs and a viewpoint, from three entrances. (Sample text.)
description:
  pl: |
    Fikcyjna ścieżka do testów aplikacji: trzy wejścia, rozwidlenia,
    ślepa odnoga do punktu widokowego i dwa bliskie przystanki przy źródliskach.
  en: |
    A fictional trail for testing: three entrances, junctions,
    a dead-end spur to a viewpoint and two close stops by the springs.

# Nazwy wejść i ślepych końców; klucze = atrybut "id" w warstwie "entrances".
entrances:
  parking:
    pl: Parking przy leśniczówce
    en: Forester's lodge car park
  przelecz:
    pl: Przełęcz
    en: Mountain pass
  wies:
    pl: Wejście od strony wsi
    en: Village entrance
  punkt-widokowy:
    pl: Punkt widokowy
    en: Viewpoint

# Kierunek, w którym napisano drukowany przewodnik.
guideDirection:
  from: parking
  to: przelecz

defaultRadius: 40
