# Buduje testowe APK przy każdym wysłaniu zmian. Do pobrania:
# - na telefonie: Releases → "Wersja testowa (najnowsza)" (main) lub "Wersja testowa: <gałąź>",
# - albo: Actions → wybrany przebieg → Artifacts → "sciezki-bdpn-debug".
name: Android APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          # Biblioteki Gradle z poprzednich buildów — mniej pobrań z Maven Central (limity 429).
          cache: gradle
          cache-dependency-path: |
            app/android/**/*.gradle*
            app/android/**/gradle-wrapper.properties

      # Android SDK jest preinstalowany na maszynach GitHuba (ANDROID_HOME);
      # brakujące składniki Gradle dociągnie sam.

      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: npm ci

      - name: Testy
        run: npm test

      - name: Build treści i aplikacji, synchronizacja z projektem Android
        run: npm run android:sync

      - name: Gradle assembleDebug
        working-directory: app/android
        # Ponowienie przy chwilowych błędach sieci (np. 429 z Maven Central).
        run: ./gradlew assembleDebug --no-daemon || (sleep 60 && ./gradlew assembleDebug --no-daemon)

      - uses: actions/upload-artifact@v4
        with:
          name: sciezki-bdpn-debug
          path: app/android/app/build/outputs/apk/debug/*.apk
          # Krótko: APK do instalacji jest w wydaniu „testowa” (nie wlicza się do limitu 500 MB na artefakty).
          retention-days: 3

      # Wydanie z najnowszym APK do pobrania na telefonie: „testowa” dla main,
      # „testowa-<gałąź>” dla pozostałych gałęzi (np. eksperymentów) — nie nadpisują się nawzajem.
      - name: Wydanie testowe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then TAG=testowa; TITLE="Wersja testowa (najnowsza)";
          else TAG="testowa-$(echo "$GITHUB_REF_NAME" | tr -c 'a-zA-Z0-9-' '-' | sed 's/-*$//')"; TITLE="Wersja testowa: $GITHUB_REF_NAME"; fi
          cp app/android/app/build/outputs/apk/debug/app-debug.apk sciezki-bdpn.apk
          NOTES="Gałąź ${GITHUB_REF_NAME}, commit ${GITHUB_SHA::7}, $(date -u +'%Y-%m-%d %H:%M') UTC"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" sciezki-bdpn.apk --prerelease --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES"
