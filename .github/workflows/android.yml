# Buduje testowe APK przy każdym wysłaniu zmian. Plik do pobrania:
# zakładka Actions → wybrany przebieg → sekcja Artifacts → "sciezki-bdpn-debug".
name: Android APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: npm ci

      - name: Testy
        run: npm test

      - name: Build treści i aplikacji, synchronizacja z projektem Android
        run: npm run android:sync

      - name: Gradle assembleDebug
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: sciezki-bdpn-debug
          path: app/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
