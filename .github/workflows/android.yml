# Buduje testowe APK przy każdym wysłaniu zmian. Do pobrania:
# - na telefonie: Releases → "Wersja testowa (najnowsza)" → sciezki-bdpn.apk,
# - albo: Actions → wybrany przebieg → Artifacts → "sciezki-bdpn-debug".
name: Android APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Android SDK jest preinstalowany na maszynach GitHuba (ANDROID_HOME);
      # brakujące składniki Gradle dociągnie sam.

      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: npm ci

      - name: Testy
        run: npm test

      - name: Build treści i aplikacji, synchronizacja z projektem Android
        run: npm run android:sync

      - name: Gradle assembleDebug
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: sciezki-bdpn-debug
          path: app/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # Stałe wydanie "testowa" z najnowszym APK — wygodne do pobrania na telefonie.
      - name: Wydanie testowe
        if: github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || startsWith(github.ref_name, 'etap-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/android/app/build/outputs/apk/debug/app-debug.apk sciezki-bdpn.apk
          NOTES="Gałąź ${GITHUB_REF_NAME}, commit ${GITHUB_SHA::7}, $(date -u +'%Y-%m-%d %H:%M') UTC"
          gh release delete testowa --yes --cleanup-tag || true
          gh release create testowa sciezki-bdpn.apk --prerelease --target "$GITHUB_SHA" \
            --title "Wersja testowa (najnowsza)" --notes "$NOTES"
